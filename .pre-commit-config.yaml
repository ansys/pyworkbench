repos:

# Ruff linting and formatting
- repo: https://github.com/charliermarsh/ruff-pre-commit
  rev: ef6cf06c079dd6b299dfc720b0f14400c9d168e1  # frozen: v0.17.5
  hooks:
    # Run the linter
    - id: ruff
      args: [--fix]
    - id: ruff-format

# Documentation linting
- repo: https://github.com/adamchainz/blacken-docs
  rev: dda8db18cfc68df532abf33b185ecd12d5b7b326  # frozen: 1.20.0
  hooks:
  - id: blacken-docs
    additional_dependencies: [black==26.10.1]

# Documentation spelling
- repo: https://github.com/codespell-project/codespell
  rev: 57b21406f092110c18776e39b0bda50d37c945c8  # frozen: v2.4.3
  hooks:
  - id: codespell
    args: ["--ignore-words", "doc/styles/config/vocabularies/ANSYS/accept.txt", "-w"]

# Ansys pre-commit hooks
- repo: https://github.com/ansys/pre-commit-hooks
  rev: dbcd0a4ad0060f78ac3c7d53d342f510edc48eab  # frozen: v0.8.1
  hooks:
    - id: add-license-headers
      files: '(src|examples|tests)/.*\.(py)|\.(proto)'
      args:
      - --start_year=2023

# General pre-commit hooks
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
  hooks:
  - id: check-merge-conflict
  - id: debug-statements
  - id: check-yaml
  - id: trailing-whitespace

# Validate GitHub actions syntax
- repo: https://github.com/python-jsonschema/check-jsonschema
  rev: a76b92851fc9eede9f9bc4073eb55202f34eb0df  # frozen: 0.39.0
  hooks:
    - id: check-github-workflows
